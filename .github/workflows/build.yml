name: Build Xiaomi 12 & 12S Pro & Redmi Note 12 Turbo Kernel

on:
  workflow_dispatch:

env:
  CLANG_VERSION: r563880c
  KERNEL_SRC: https://github.com/LineageOS/android_kernel_xiaomi_sm8450
  BRANCH: lineage-23.2

jobs:
  build:
    name: ${{ matrix.device }}-${{ matrix.ksu_status }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        device: [ "Xiaomi12", "Xiaomi12SPro", "RedmiNote12Turbo" ]
        ksu_status: [ "WithKSU", "NoKSU" ]

    steps:
    - name: Setup SWAP
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 16
          
    - name: 准备环境
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc build-essential flex bison libssl-dev libelf-dev clang lld llvm python3 zip

    - name: 编译器缓存
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/clang-aosp
        key: clang-${{ env.CLANG_VERSION }}

    - name: 下载 Clang (r563880c)
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ github.workspace }}/clang-aosp
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/clang-${{ env.CLANG_VERSION }}.tar.gz
        tar -C ${{ github.workspace }}/clang-aosp -xf clang-${{ env.CLANG_VERSION }}.tar.gz

    - name: 检出源码
      run: |
        cd $GITHUB_WORKSPACE
        git clone --depth=1 ${{ env.KERNEL_SRC }} -b ${{ env.BRANCH }} sm8450
        sed -i 's/ -dirty//g' sm8450/scripts/setlocalversion

    - name: 集成 KernelSU & SUSFS
      if: ${{ matrix.ksu_status == 'WithKSU' }}
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
        cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $GITHUB_WORKSPACE/sm8450/KernelSU/
        cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.10.patch $GITHUB_WORKSPACE/sm8450/common/
        cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/* $GITHUB_WORKSPACE/sm8450/common/fs/
        cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/* $GITHUB_WORKSPACE/sm8450/common/include/linux/
        
        cd $GITHUB_WORKSPACE/sm8450/KernelSU
        patch -p1 < 10_enable_susfs_for_ksu.patch
        cd $GITHUB_WORKSPACE/sm8450/common
        patch -p1 < 50_add_susfs_in_kernel-5.10.patch
        
        echo "CONFIG_KSU=y" >> $GITHUB_WORKSPACE/sm8450/arch/arm64/configs/gki_defconfig
        echo "CONFIG_KSU_SUSFS=y" >> $GITHUB_WORKSPACE/sm8450/arch/arm64/configs/gki_defconfig

    - name: 集成 Re:Kernel 基础补丁 (Integrate)
      run: |
        cd $GITHUB_WORKSPACE
        git clone -b upstream/v9.2 https://github.com/myflavor/ReKernel-X.git rekernel_tmp
        cp -r rekernel_tmp/Integrate/* $GITHUB_WORKSPACE/sm8450/
        rm -rf rekernel_tmp
        
        cd $GITHUB_WORKSPACE/sm8450
        chmod +x patches.sh
        ./patches.sh

    - name: 集成 Re:Kernel LKM 源码 (Built-in 模式优化版)
      run: |
        cd $GITHUB_WORKSPACE
        git clone -b main https://github.com/myflavor/ReKernel-X.git rekernel_lkm
        mkdir -p $GITHUB_WORKSPACE/sm8450/drivers/rekernel_x
        cp -r rekernel_lkm/LKM-Source/* $GITHUB_WORKSPACE/sm8450/drivers/rekernel_x/
        rm -rf rekernel_lkm
        
        cd $GITHUB_WORKSPACE/sm8450/drivers/rekernel_x
        sed -i 's/obj-m/obj-y/g' Makefile
        
        cd $GITHUB_WORKSPACE/sm8450
        echo 'source "drivers/rekernel_x/Kconfig"' >> drivers/Kconfig
        echo 'obj-y += rekernel_x/' >> drivers/Makefile

    - name: 编译内核
      run: |
        cd sm8450
        export PATH="${{ github.workspace }}/clang-aosp/bin:$PATH"
        
        MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
        MAKE_ARGS="$MAKE_ARGS REKERNEL_X_VERSION=v9.2-BuiltIn"
        
        if [ "${{ matrix.device }}" = "Xiaomi12" ]; then
            CONFIG_LIST="gki_defconfig vendor/xiaomi_GKI.config vendor/cupid_GKI.config vendor/waipio_GKI.config vendor/debugfs.config"
        elif [ "${{ matrix.device }}" = "Xiaomi12SPro" ]; then
            CONFIG_LIST="gki_defconfig vendor/xiaomi_GKI.config vendor/unicorn_GKI.config vendor/waipio_GKI.config vendor/debugfs.config"
        else
            CONFIG_LIST="gki_defconfig vendor/xiaomi_GKI.config vendor/marble_GKI.config vendor/waipio_GKI.config vendor/debugfs.config"
        fi
        
        make O=out $MAKE_ARGS $CONFIG_LIST
        make -j$(nproc --all) O=out $MAKE_ARGS

    - name: 打包 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=.*!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        cp sm8450/out/arch/arm64/boot/Image AnyKernel3/
        
        ZIP_NAME="${{ matrix.device }}-${{ matrix.ksu_status }}.zip"
        cd AnyKernel3 && zip -r ../$ZIP_NAME ./*

    - name: 上传刷机包 (AnyKernel3)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.device }}-${{ matrix.ksu_status }}-ZIP
        path: ${{ github.workspace }}/${{ matrix.device }}-${{ matrix.ksu_status }}.zip